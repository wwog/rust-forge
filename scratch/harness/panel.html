</head><body><div id="root" class="root"></div>
<script>
window.rustForge={post:()=>{}};
window.RF_ZH = new URLSearchParams(location.search).get('lang') === 'zh';
</script>
<script>
fetch('./zh.json').then(r=>r.json()).then(d=>{ window.rustForge.i18n = window.RF_ZH ? d : {}; window.__dictReady = true; });
</script>
<script>
(function load(){
  if (window.RF_ZH && !window.__dictReady) { setTimeout(load, 60); return; }
  if (window.__loaded) return;
  window.__loaded = true;
  const s=document.createElement("script");
  s.src="./panels.js?v=" + Date.now();
  document.body.appendChild(s);
})();
</script>
